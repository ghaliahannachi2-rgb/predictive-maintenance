services:
  mongo:
    image: mongo:7
    container_name: ma_base_mongo
    ports:
      - "27017:27017"
    volumes:
      - donnees_mongo:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: le_messager_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  postgres:
    image: postgres:16
    container_name: pm-postgres
    environment:
      POSTGRES_DB: usine
      POSTGRES_USER: admin_usine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  donnees_mongo:
  pgdata: